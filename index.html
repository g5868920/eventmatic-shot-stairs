<!DOCTYPE html>
<html>
<head>
<title>SHOT the Stairs</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="white">
<meta name="apple-mobile-web-app-title" content="SHOT the Stairs">
<link rel="apple-touch-icon" href="icon.png">
<style>
	body{margin: 0; -webkit-user-select: none; user-select: none;}
	#content{text-align: center;}
	kbd{display: inline-block; padding: 3px 5px; color: #444d56; background-color: #fafbfc; border: solid 1px #c6cbd1; border-bottom-color: #959da5; border-radius: 3px; box-shadow: inset 0 -1px 0 #959da5;}
	dl{margin:0 auto; width:95%;}
	dt{font-weight:bold; font-size: 18pt;}
	dd{display: list-item; font-size: 12pt; margin-left: 1.5em;}
	footer{font-size: 10pt; color: #666; text-align: center; margin: 1em;}
	html, body{background: #1c0f22;}
	/* SHOT: landscape screens / projectors: game centred in the viewport, attribution in the side pillarbox */
	@media (min-aspect-ratio: 4/3) {
		#content{display: flex; align-items: center; justify-content: center; height: 100vh;}
		footer{position: fixed; left: 0; bottom: 0; margin: 0 0 .8em 1em; text-align: left; max-width: calc(50vw - 37.3vh - 2em);}
	}
</style>
</head>
<body>
	<div id="content">Loading...</div>
	<!-- Ready and optional How to Play use the approved B canvas screens. -->
	<footer>Based on <a href="https://github.com/iPel/NS-SHAFT">NS-SHAFT by iPel</a> (Apache-2.0). Modifications &copy; Eventmatic, see NOTICE.</footer>
	<script>
	window.onerror = function (msg, url, lineNo, columnNo, error) {
		var node = document.body;
		var string = msg.toLowerCase();
		var substring = "script error";
		if (string.indexOf(substring) > -1){
			node.appendChild(document.createTextNode('Script Error: See Console for Detail'));
		} else {
			var message = [
				'Message: ' + msg,
				'URL: ' + url,
				'Line: ' + lineNo,
				'Column: ' + columnNo,
				'Error object: ' + JSON.stringify(error)
			].join(' - ');
			node.appendChild(document.createTextNode(message));
		}
		return false;
	};
	</script>
	<script src="config.js"></script>
	<script src="assets/characters/custom/skins.js"></script>
	<script src="assets/characters/custom/anims.js"></script>
	<script src="arcade-visuals.js"></script>
	<script src="sprites.js"></script>
	<script src="arcade-screens.js"></script>
	<script src="game.js"></script>
	<script src="audio.js"></script>
	<script src="eventmatic-bridge.js"></script>
	<script>
	~function(){
		var Game = window.Game;
		Game && Game.launch(document.getElementById('content'));
	}();
	</script>
</body>
</html>
